<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>준비중입니다</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #f5e6d3;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img
    src="maintenance.webp"
    alt="모바일 청첩장을 준비중입니다. 조금만 기다려 주세요!"
    width="1080"
    height="1920"
  >
</body>
</html>
